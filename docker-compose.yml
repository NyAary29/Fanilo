# Environnement de DÉVELOPPEMENT uniquement. Ne pas utiliser tel quel en production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    ports:
      - "127.0.0.1:${FANILO_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./services/ai
    environment:
      FANILO_AI_ASR_BACKEND: ${FANILO_AI_ASR_BACKEND:-none}
    # Service interne : pas de port publié, joignable par l'API sous « ai ».
    expose:
      - "8001"

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      FANILO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      FANILO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FANILO_AI_SERVICE_URL: http://ai:8001
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_started

volumes:
  pgdata:
