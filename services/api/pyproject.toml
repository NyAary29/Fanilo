[project]
name = "fanilo-api"
version = "0.1.0"
description = "API backend de FANILO — assistant vocal de santé (Madagascar)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "cryptography>=44,<49",
    "pyyaml>=6.0",
    # Appels au service IA interne (/transcribe, /classify).
    "httpx>=0.27",
    # Formulaires multipart (audio de /interactions/ask, relayé en mémoire).
    "python-multipart>=0.0.9",
    # Moteur de règles déterministe (services/rules), dépendance de chemin.
    "fanilo-rules",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.uv.sources]
fanilo-rules = { path = "../rules", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
